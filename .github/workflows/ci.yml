name: CI

on:
  push:
    branches:
      - main
      - elisamio2000-phase-8-9-expert-lab-qa-security
  pull_request:

jobs:
  api:
    name: API (phase lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiosqlite

      - name: Ruff (phase scope)
        run: |
          ruff check \
            app/config.py \
            app/main.py \
            app/scoring.py \
            app/schemas.py \
            app/schemas_assessment.py \
            app/security.py \
            app/models/__init__.py \
            app/models/analytics.py \
            app/models/assessment.py \
            app/models/expert_lab.py \
            app/routers/admin_versions.py \
            app/routers/analytics.py \
            app/routers/expert_lab.py \
            app/routers/reports.py \
            app/routers/sessions.py \
            app/services/assessment_scoring.py \
            app/services/analytics.py \
            app/services/expert_lab.py \
            app/services/formula_engine.py \
            app/services/question_bank_quality.py \
            tests/test_phase2_phase3_api.py \
            tests/test_formula_engine.py \
            tests/test_reports_api.py \
            tests/test_scoring.py \
            tests/test_analytics.py \
            tests/test_expert_lab.py \
            tests/test_security.py

      - name: Pytest assessment quality gates
        run: |
          pytest -q \
            tests/test_scoring.py \
            tests/test_phase2_phase3_api.py \
            tests/test_formula_engine.py \
            tests/test_reports_api.py

      - name: Pytest
        run: pytest -q

  web:
    name: Web (lint + focused tests)
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: ci-dev-secret
      NEXTAUTH_URL: http://localhost:3000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Web lint
        run: pnpm web:lint

      - name: Web focused tests
        run: |
          pnpm --filter holand-web-app exec vitest run \
            src/services/analytics.service.test.ts \
            src/services/assessment.service.test.ts \
            src/services/expert-lab.service.test.ts \
            src/hooks/use-funnel-tracking.test.ts \
            src/app/shared/expert-lab/__tests__/status-badge.test.tsx \
            src/app/shared/expert-lab/__tests__/expert-lab-dashboard.test.tsx \
            src/app/shared/assessment-funnel/__tests__/assessment-funnel-dashboard.test.tsx
